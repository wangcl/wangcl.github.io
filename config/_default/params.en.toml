# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon        = "img/snake.png"

# Accepted values: "default", "lastmod"
SortBy         = "default"

[footer]
    customText = "created by hugo-stack-starter"

[dateFormat]
    published   = ":date_medium"
    lastUpdated = ":date_medium"

[sidebar]
    emoji    = "🚀"
    subtitle = "Developer. Go enthusiast. Soccer fanatic."
    avatar   = "img/iceberg.jpg"

[article]
    headingAnchor = true
    math          = false
    readingTime   = true

    [article.license]
        enabled = true
        default = "Licensed under CC BY-NC-SA 4.0"
